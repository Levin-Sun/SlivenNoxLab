# SlivenNoxLab Nginx 站点配置模板
# 位置：/etc/nginx/conf.d/slivennoxlab.conf
# 生效：nginx -t && systemctl reload nginx
# 说明：个人站占顶级域，Umax RAG 反代到 /rag/*（拷问 Q-A 确认的路径反代方案）

server {
    listen 80;
    listen [::]:80;
    server_name umax.dpdns.org;

    # certbot 续期放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name umax.dpdns.org;

    # Let's Encrypt 证书（certbot --nginx 自动接管后这两行会被托管）
    ssl_certificate     /etc/letsencrypt/live/umax.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umax.dpdns.org/privkey.pem;

    # 个人站静态根目录（deploy.yml 的 rsync 目标）
    root /var/www/slivennoxlab;
    index index.html;

    # 带内容哈希的构建产物：永久缓存
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pagefind 索引：可较长缓存
    location /pagefind/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML：短缓存 + 协商
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Umax RAG：路径反代（若 RAG 与本站同机，proxy_pass 指向本机端口；
    # 端口按 RAG 实际监听调整；若部署在其他机器，改成对应地址）
    location /rag/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持（RAG 如有流式输出需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
