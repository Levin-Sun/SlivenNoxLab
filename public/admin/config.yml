# Decap CMS 配置：网页内编辑发布
# 发布动线：后台保存 → commit 到 GitHub 仓库 → CI 构建上线
#
# 首次启用需要两步（一次性）：
# 1. GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
#    - Homepage URL: https://umax.dpdns.org
#    - Authorization callback URL: https://umax.dpdns.org/admin/
#    创建后把 Client ID 填到下面的 app_id
# 2. 本地预览编辑无需 OAuth：npm run build && npx decap-server，然后访问 /admin/
#
# 改完这份配置后 CMS 有缓存，强刷一次生效。

backend:
  name: github
  repo: Levin-Sun/slivennoxlab
  branch: main
  auth_type: pkce
  app_id: REPLACE_WITH_GITHUB_OAUTH_APP_CLIENT_ID
local_backend: true

publish_mode: simple
media_folder: public/uploads
public_path: /uploads

locale: zh_Hans

collections:
  - name: note-categories
    label: 笔记分类
    files:
      - name: note-categories-file
        label: 分类列表
        file: src/data/note-categories.json
        fields:
          - name: categories
            label: 分类
            widget: list
            fields:
              - { name: key, label: 标识（英文小写）, widget: string }
              - { name: label, label: 分类名, widget: string }
              - { name: order, label: 排序（小的在前）, widget: number, required: false }

  - name: favorites
    label: 收藏夹
    files:
      - name: favorites-file
        label: 收藏数据
        file: src/data/favorites.json
        fields:
          - name: categories
            label: 分类
            widget: list
            fields:
              - { name: key, label: 标识（英文小写）, widget: string }
              - { name: label, label: 分类名, widget: string }
              - name: items
                label: 条目
                widget: list
                fields:
                  - { name: name, label: 名称, widget: string }
                  - { name: href, label: 链接, widget: string }
                  - { name: desc, label: 一句话说明, widget: string, required: false }
                  - { name: host, label: 域名（不传图标时用于自动抓取 favicon）, widget: string, required: false }
                  - { name: icon, label: 自定义图标, widget: image, required: false }
                  - { name: cover, label: 封面图（影视海报等）, widget: image, required: false }

  - name: albums
    label: 相册
    label_singular: 相册
    files:
      - name: album-list
        label: 相册列表
        file: src/data/albums.json
        fields:
          - name: albums
            label: 相册
            widget: list
            fields:
              - { name: slug, label: 文件夹名（英文，对应 src/assets/photos/ 下的文件夹）, widget: string, hint: 建好后把照片放进 src/assets/photos/这个名称/ 文件夹 }
              - { name: title, label: 相册名称, widget: string }
              - { name: category, label: 分类（如 人像/风景/街拍）, widget: string, default: 风景 }
              - { name: desc, label: 一句话描述, widget: string, required: false }
              - { name: order, label: 排序（小的在前）, widget: number, required: false }

  - name: notes
    label: 技术笔记
    label_singular: 笔记
    folder: src/content/notes
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    create: true
    sortable_fields: [pubDate, title]
    editor:
      preview: false
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: pubDate, label: 发布日期, widget: datetime, format: 'YYYY-MM-DD' }
      - { name: category, label: 分类（可自由填写，如 技术/日常/感悟）, widget: string, required: false }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - name: stage
        label: 成熟度
        widget: select
        options: [{ label: 幼苗, value: seedling }, { label: 常青, value: evergreen }]
        default: seedling
        required: false
      - { name: body, label: 正文, widget: markdown }

  - name: projects
    label: 作品集
    label_singular: 作品
    folder: src/content/projects
    slug: '{{slug}}'
    create: true
    sortable_fields: [pubDate, title]
    editor:
      preview: false
    fields:
      - { name: title, label: 名称, widget: string }
      - { name: description, label: 一句话介绍, widget: text }
      - { name: pubDate, label: 发布日期, widget: datetime, format: 'YYYY-MM-DD' }
      - { name: cover, label: 封面图, widget: image, required: false }
      - { name: tech, label: 技术栈, widget: list, required: false, default: [] }
      - name: category
        label: 分类
        widget: select
        options: [{ label: 开发, value: dev }, { label: 设计, value: design }, { label: 摄影, value: photo }]
        default: dev
      - { name: demoUrl, label: Demo 地址, widget: string, required: false }
      - { name: repoUrl, label: 源码地址, widget: string, required: false }
      - { name: body, label:详细介绍, widget: markdown, required: false }
