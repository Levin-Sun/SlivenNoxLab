# 部署流水线：push 到 main → 构建 → rsync 上传阿里云服务器
# 首次启用需要在仓库 Settings → Secrets and variables → Actions 配置：
#   SSH_HOST        服务器 IP（或解析到服务器的域名）
#   SSH_USER        SSH 用户（如 root）
#   SSH_PORT        SSH 端口（默认 22 时可省略此 secret）
#   SSH_PRIVATE_KEY 服务器登录私钥（cat ~/.ssh/id_ed25519 的完整内容）
# 服务器端准备见 docs/DEPLOY.md
# 注意：SSH Secrets 未配置时流水线会优雅跳过（显示 skipped 而非 failed）

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 守卫：secrets 上下文不能用于 job 级 if，只能在步骤内判断
      - name: 检查部署密钥
        id: guard
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SSH Secrets 未配置，跳过部署（在仓库 Settings 配置后自动启用）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: 构建
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      - name: 配置 SSH
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步到服务器
        if: steps.guard.outputs.skip != 'true'
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude 'pagefind/pagefind-entry.json' \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/slivennoxlab/
